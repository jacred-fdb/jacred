openapi: 3.0.3
info:
  title: JacRed API
  version: 1.2.1
  description: |
    Torrent aggregator API: Jackett-compatible search, native torrent search, Torznab XML,
    statistics, sync protocol, and configuration management.

    **Interactive docs:** [Swagger UI](/swagger)

    **Runtime OpenAPI JSON:** `/swagger/v1/swagger.json` (converted from this YAML file)

    **Static spec (this file):** `/openapi.yaml` (source: `web/public/openapi.yaml`, published to `wwwroot/openapi.yaml`)

    ## Supported tracker slugs (v1.2)

    Parsers / cron (`/cron/{slug}/…`, DevAdmin):
    `anibelka`, `anidub`, `anifilm`, `aniliberty`, `animelayer`, `anistar`, `baibako`,
    `bitru`, `kinozal`, `knaben`, `korsars`, `leproduction`, `lostfilm`, `mazepa`,
    `megapeer`, `nnmclub`, `rudub`, `rutor`, `rutracker`, `selezen`, `toloka`, `torrentby`,
    `ultradox`, `viruseproject`.

    Web UI icons: `/img/ico/{slug}.ico` (fallback `/img/ico/default.ico`).

    Page-only parsers (`anistar`, `leproduction`, `viruseproject`, `anifilm`) usually do **not**
    appear in `GET /health/background-jobs` (only UpdateTasks/ParseAll-style workers register there).

    ## Authentication

    | Scheme | Usage |
    |--------|--------|
    | `apikey` query | Search, stats (when `apikey` is set in config) |
    | `X-Api-Key` header | Same as query apikey |
    | `Authorization: Bearer` | Same as apikey |
    | `X-Dev-Key` header | /dev/, /cron/, /jsondb, `/api/v1.0/config/*` из интернета или через туннель |
    | `devkey` query | Same as `X-Dev-Key` (`?devkey=`) |

    **Config API** (`/api/v1.0/config/*`): LAN-клиент **или** `X-Dev-Key` / `?devkey=`.
    Same-host reverse proxy (Cloudflare Tunnel, nginx) **сам по себе не заменяет** devkey.

    **Sync** (`/sync/*`): middleware пропускает без ключей; данные sync требуют `opensync: true` в конфиге.

    **Dev/cron/jsondb:** `/dev/*`, `/cron/*`, `/jsondb/*` require DevAdmin (`X-Dev-Key` / `?devkey=`).
    Those operational actions are **not** enumerated path-by-path in this public spec; see Controllers,
    [`Data/crontab`](Data/crontab), and [`AccessTraceabilityMatrix.md`](AccessTraceabilityMatrix.md).

    Полная матрица: [`AccessTraceabilityMatrix.md`](AccessTraceabilityMatrix.md).

    ## Config files

    Application settings live in `init.yaml` (preferred) or `init.conf` (JSON). See `Data/example.yaml`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: JacRed
    url: https://github.com/jacred-fdb/jacred

servers:
  - url: /
    description: Current host (default port 9117)

tags:
  - name: System
    description: Health (including background jobs), version, API key check
  - name: Search
    description: Jackett-compatible and native torrent search
  - name: Torznab
    description: Torznab XML for Sonarr/Radarr/Prowlarr
  - name: Stats
    description: Tracker statistics (requires openstats)
  - name: Sync
    description: Remote sync protocol (requires opensync)
  - name: Config
    description: init.yaml / init.conf read/write (LAN or X-Dev-Key / ?devkey=)
  - name: Web
    description: PWA HTML shells

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/background-jobs:
    get:
      tags: [System]
      summary: In-process background ParseAll / UpdateTasks jobs
      description: |
        Local ops status for active tracker sync jobs started via `/cron/{slug}/…`.
        Public (no apikey). Empty `jobs` array when nothing is running.
      operationId: healthBackgroundJobs
      security: []
      responses:
        "200":
          description: Active background jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJobsResponse"

  /version:
    get:
      tags: [System]
      summary: Build version info
      operationId: version
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /lastupdatedb:
    get:
      tags: [System]
      summary: Last FileDB update time
      operationId: lastUpdateDb
      security: []
      responses:
        "200":
          description: Last update timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastupdatedb:
                    type: string
                    example: "04.07.2026 15:30"

  /api/v1.0/conf:
    get:
      tags: [System]
      summary: Validate API key
      description: Returns whether the provided apikey matches server configuration. Whitelisted without apikey.
      operationId: checkApiKey
      security: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Key validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  apikey:
                    type: boolean
                    description: true if key is valid or server has no apikey configured

  /api/v2.0/indexers/{status}/results:
    get:
      tags: [Search]
      summary: Jackett-compatible search
      description: |
        Lampa and other Jackett JSON clients. Path `{status}` is normally `all` (aggregate).
        When `{status}` is a tracker id from `GET /api/v1.0/trackers` (for example `rutracker`),
        results are filtered to that tracker (case-insensitive; matches any part of a merged trackerName).
      operationId: jackettSearch
      parameters:
        - name: status
          in: path
          required: true
          description: |
            `all` for aggregate search, or a tracker id (e.g. `kinozal`, `rutracker`) to scope results.
          schema:
            type: string
            example: all
        - $ref: "#/components/parameters/ApiKeyQuery"
        - name: query
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/SearchQueryAlt"
        - $ref: "#/components/parameters/TorznabTitle"
        - $ref: "#/components/parameters/TorznabTitleOriginal"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/IsSerial"
        - $ref: "#/components/parameters/CategoryBracket"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/TorznabCat"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/TrackerArray"
        - $ref: "#/components/parameters/TrackerFilter"
        - $ref: "#/components/parameters/TrackerAlias"
        - $ref: "#/components/parameters/TorznabImdbId"
        - $ref: "#/components/parameters/ImdbIdAltUnderscore"
        - $ref: "#/components/parameters/ImdbIdAltCamel"
        - $ref: "#/components/parameters/TorznabSeason"
        - $ref: "#/components/parameters/TorznabEp"
        - $ref: "#/components/parameters/TorznabEpisode"
        - $ref: "#/components/parameters/TorznabLimit"
        - $ref: "#/components/parameters/TorznabOffset"
        - $ref: "#/components/parameters/Genres"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JackettRootObject"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1.0/torrents:
    get:
      tags: [Search]
      summary: Native torrent search
      operationId: torrentsSearch
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Empty or omitted yields an empty result array
        - name: altname
          in: query
          schema:
            type: string
        - name: exact
          in: query
          schema:
            type: boolean
        - name: type
          in: query
          schema:
            type: string
            description: movie, serial, anime, etc.
        - name: sort
          in: query
          schema:
            type: string
            enum: [sid, pir, size, create, update]
        - $ref: "#/components/parameters/TrackerAlias"
        - name: voice
          in: query
          schema:
            type: string
        - name: videotype
          in: query
          schema:
            type: string
        - name: relased
          in: query
          schema:
            type: integer
        - name: quality
          in: query
          schema:
            type: integer
        - name: season
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Ordered torrent result array (maximum 2000 items)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TorrentListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1.0/trackers:
    get:
      tags: [Search]
      summary: List available tracker names
      description: |
        Returns tracker ids for discovery and filters.
        Source: `synctrackers` when set (including empty `[]` → empty list); otherwise known built-in slugs.
        Entries in `disable_trackers` are excluded. Sorted case-insensitively.
      operationId: trackerNames
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Available tracker names (e.g. rutracker, kinozal, korsars)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerSlug"
                example: [kinozal, korsars, rutracker, rutor]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1.0/qualitys:
    get:
      tags: [Search]
      summary: Quality aggregation by title
      operationId: qualitys
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
        - name: name
          in: query
          schema:
            type: string
        - name: originalname
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: take
          in: query
          schema:
            type: integer
            default: 1000
      responses:
        "200":
          description: |
            Nested map: title key → release year → TorrentQuality.
            Empty name and originalname yields `{}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/TorrentQuality"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /torznab/api:
    get:
      tags: [Torznab]
      summary: Torznab API (caps, search)
      description: |
        Native Torznab XML when `torznab.enable` is true.
        Caps advertise `q`, `imdbid`[, `tvdbid`, `season`, `ep`]. JacRed also accepts card fields
        (`title`, `title_original`, `year`, `is_serial`, `genres`), pagination (`limit`/`offset`),
        category aliases (`cat`/`Category`/`categories`/`Category[]`), and tracker filters
        (`Tracker`/`Tracker[]`/`tracker`).
        `t=indexers` returns aggregate `all` plus one indexer entry per `GET /api/v1.0/trackers` name.
      operationId: torznabRoot
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
        - $ref: "#/components/parameters/TorznabT"
        - $ref: "#/components/parameters/TorznabQ"
        - $ref: "#/components/parameters/SearchQueryAlt"
        - $ref: "#/components/parameters/TorznabCat"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryBracket"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/TorznabImdbId"
        - $ref: "#/components/parameters/ImdbIdAltUnderscore"
        - $ref: "#/components/parameters/ImdbIdAltCamel"
        - $ref: "#/components/parameters/TorznabTvdbId"
        - $ref: "#/components/parameters/TorznabRid"
        - $ref: "#/components/parameters/TorznabSeason"
        - $ref: "#/components/parameters/TorznabEp"
        - $ref: "#/components/parameters/TorznabEpisode"
        - $ref: "#/components/parameters/TorznabTitle"
        - $ref: "#/components/parameters/TorznabTitleOriginal"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/IsSerial"
        - $ref: "#/components/parameters/Genres"
        - $ref: "#/components/parameters/TorznabLimit"
        - $ref: "#/components/parameters/TorznabOffset"
        - $ref: "#/components/parameters/TorznabConfigured"
        - $ref: "#/components/parameters/TrackerFilter"
        - $ref: "#/components/parameters/TrackerArray"
        - $ref: "#/components/parameters/TrackerAlias"
      responses:
        "200":
          description: Torznab XML
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled
    head:
      tags: [Torznab]
      summary: Torznab HEAD probe
      description: Returns empty Torznab XML body (same content-type as GET).
      operationId: torznabRootHead
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Empty XML OK
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled

  /api/v2.0/indexers/{indexer}/results/torznab/api:
    get:
      tags: [Torznab]
      summary: Torznab API (indexer path)
      description: |
        Jackett-compatible Torznab alias. Path `{indexer}` is normally `all`.
        When `{indexer}` is a tracker id (not `all`), search results are filtered to that tracker.
        `t=indexers` lists `all` plus per-tracker indexers from the tracker catalog.
        Same query params as `/torznab/api` (caps + JacRed card fields, categories, tracker filters).
      operationId: torznabIndexer
      parameters:
        - name: indexer
          in: path
          required: true
          description: |
            `all` for aggregate search, or a tracker id (e.g. `rutracker`) to scope results.
          schema:
            type: string
            example: all
        - $ref: "#/components/parameters/ApiKeyQuery"
        - $ref: "#/components/parameters/TorznabT"
        - $ref: "#/components/parameters/TorznabQ"
        - $ref: "#/components/parameters/SearchQueryAlt"
        - $ref: "#/components/parameters/TorznabCat"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryBracket"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/TorznabImdbId"
        - $ref: "#/components/parameters/ImdbIdAltUnderscore"
        - $ref: "#/components/parameters/ImdbIdAltCamel"
        - $ref: "#/components/parameters/TorznabTvdbId"
        - $ref: "#/components/parameters/TorznabRid"
        - $ref: "#/components/parameters/TorznabSeason"
        - $ref: "#/components/parameters/TorznabEp"
        - $ref: "#/components/parameters/TorznabEpisode"
        - $ref: "#/components/parameters/TorznabTitle"
        - $ref: "#/components/parameters/TorznabTitleOriginal"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/IsSerial"
        - $ref: "#/components/parameters/Genres"
        - $ref: "#/components/parameters/TorznabLimit"
        - $ref: "#/components/parameters/TorznabOffset"
        - $ref: "#/components/parameters/TorznabConfigured"
        - $ref: "#/components/parameters/TrackerFilter"
        - $ref: "#/components/parameters/TrackerArray"
        - $ref: "#/components/parameters/TrackerAlias"
      responses:
        "200":
          description: Torznab XML
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled
    head:
      tags: [Torznab]
      summary: Torznab HEAD probe (indexer path)
      description: Returns empty Torznab XML body (same content-type as GET).
      operationId: torznabIndexerHead
      parameters:
        - name: indexer
          in: path
          required: true
          schema:
            type: string
            example: all
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Empty XML OK
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled

  /api/v2.0/indexers:
    get:
      tags: [Torznab]
      summary: List configured indexers (Jackett)
      description: |
        Jackett-style indexer discovery. Always includes aggregate `id=all`, then one entry per
        `GET /api/v1.0/trackers` name (same set as Torznab `t=indexers`).
        Prowlarr clients should use `/api/v1/indexer` (single aggregate `id=1`).
      operationId: indexersList
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Indexer list (`all` + per-tracker)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JackettIndexer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/indexer:
    get:
      tags: [Torznab]
      summary: Prowlarr indexer list
      description: |
        Prowlarr-compatible indexer list for discover clients (qui, autobrr) and Prowlarr apps.
        Returns a JSON array with `enable: true` and `protocol: torrent`.
      operationId: prowlarrIndexerList
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
        - name: X-Api-Key
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Enabled torrent indexers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProwlarrIndexer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled

  /api/v1/indexer/{id}:
    get:
      tags: [Torznab]
      summary: Prowlarr indexer detail
      description: |
        Prowlarr-compatible indexer detail for qui tracker domain resolution (backend=prowlarr).
        JacRed exposes a single aggregate indexer with `id=1`.
      operationId: prowlarrIndexerDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Indexer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProwlarrIndexerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled or unknown indexer id

  /api/v1/indexer/{indexer}/newznab:
    get:
      tags: [Torznab]
      summary: Prowlarr Torznab proxy
      description: |
        Prowlarr-compatible Torznab endpoint (`t=caps`, `search`, `tvsearch`, `moviesearch`).
        Same handler as `/torznab/api` and Jackett alias paths.
        Path `{indexer}` is typically numeric (`1` = aggregate JacRed); numeric ids do not apply a tracker filter.
      operationId: prowlarrNewznab
      parameters:
        - name: indexer
          in: path
          required: true
          description: Prowlarr indexer id (use `1` for JacRed aggregate)
          schema:
            type: string
            example: "1"
        - $ref: "#/components/parameters/ApiKeyQuery"
        - $ref: "#/components/parameters/TorznabT"
        - $ref: "#/components/parameters/TorznabQ"
        - $ref: "#/components/parameters/SearchQueryAlt"
        - $ref: "#/components/parameters/TorznabCat"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryBracket"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/TorznabImdbId"
        - $ref: "#/components/parameters/ImdbIdAltUnderscore"
        - $ref: "#/components/parameters/ImdbIdAltCamel"
        - $ref: "#/components/parameters/TorznabTvdbId"
        - $ref: "#/components/parameters/TorznabRid"
        - $ref: "#/components/parameters/TorznabSeason"
        - $ref: "#/components/parameters/TorznabEp"
        - $ref: "#/components/parameters/TorznabEpisode"
        - $ref: "#/components/parameters/TorznabTitle"
        - $ref: "#/components/parameters/TorznabTitleOriginal"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/IsSerial"
        - $ref: "#/components/parameters/Genres"
        - $ref: "#/components/parameters/TorznabLimit"
        - $ref: "#/components/parameters/TorznabOffset"
        - $ref: "#/components/parameters/TorznabConfigured"
        - $ref: "#/components/parameters/TrackerFilter"
        - $ref: "#/components/parameters/TrackerArray"
        - $ref: "#/components/parameters/TrackerAlias"
      responses:
        "200":
          description: Torznab XML
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled
    head:
      tags: [Torznab]
      summary: Prowlarr Torznab HEAD probe
      description: Returns empty Torznab XML body (same content-type as GET).
      operationId: prowlarrNewznabHead
      parameters:
        - name: indexer
          in: path
          required: true
          schema:
            type: string
            example: "1"
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Empty XML OK
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled

  /api/v1/search:
    get:
      tags: [Torznab]
      summary: Prowlarr Search Feed
      description: |
        Prowlarr-compatible interactive search (`/api/v1/search`).
        Returns a JSON array of ReleaseResource-shaped objects.
        Brace tokens in `query` (e.g. `{ImdbId:tt123}`, `{Season:1}`) are parsed like Prowlarr UI search.
        JacRed exposes a single aggregate torrent indexer (`id=1`); `indexerIds=-1` (usenet) returns `[]`.
        Each release also includes JacRed extensions (`ffprobe`, `languages`, `info`) when `tracks: true`, same as Jackett results.
        Lampa Prowlarr mode (`query` + `type` + `categories`) is promoted to Jackett-style card search
        (`title`/`title_original`/`year`, `is_serial` 1=movie / 2=serial) for richer TV/movie results.
      operationId: prowlarrSearch
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
        - name: X-Api-Key
          in: header
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
          description: URL-encoded search string (supports Prowlarr brace tokens)
        - $ref: "#/components/parameters/SearchQ"
        - name: type
          in: query
          schema:
            type: string
            enum: [search, tvsearch, movie, moviesearch, tv, music, book]
            default: search
          description: |
            Search kind. `movie`/`moviesearch` map to `is_serial=1`; `tv`/`tvsearch` map to `is_serial=2`.
        - name: indexerIds
          in: query
          schema:
            type: string
          description: Comma-separated or repeated; `1` or `-2` (torrents) select JacRed; omit = all; `-1` = usenet (empty)
          example: "1"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/TorznabCat"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryBracket"
        - $ref: "#/components/parameters/TorznabTitle"
        - $ref: "#/components/parameters/TorznabTitleOriginal"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/IsSerial"
        - $ref: "#/components/parameters/TorznabSeason"
        - $ref: "#/components/parameters/TorznabEp"
        - $ref: "#/components/parameters/TorznabEpisode"
        - $ref: "#/components/parameters/Genres"
        - $ref: "#/components/parameters/TrackerFilter"
        - $ref: "#/components/parameters/TrackerArray"
        - $ref: "#/components/parameters/TrackerAlias"
        - $ref: "#/components/parameters/TorznabLimit"
        - $ref: "#/components/parameters/TorznabOffset"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProwlarrRelease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Torznab disabled

  /stats/torrents:
    get:
      tags: [Stats]
      summary: Tracker summary (stats.json)
      description: |
        All trackers from Data/temp/stats.json. Used by web UI `/stats`.
        When `openstats: false`, still returns **200** with body `[]` (soft disable; not a middleware 401).
        Missing/invalid API key (when configured) is a separate **401**.
      operationId: statsTorrents
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: Tracker summary array (or `[]` when openstats is false)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerStat"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stats/tracks:
    get:
      tags: [Stats]
      summary: Tracks export aggregate (tracks-stats.json cache)
      description: |
        Read-only cache from Data/temp/tracks-stats.json. Force refresh via `/dev/TracksStats?refresh=true`.
        When `openstats: false`, still returns **200** with `{ ok: false }` (soft disable; not a middleware 401).
        Missing/invalid API key (when configured) is a separate **401**.
      operationId: statsTracks
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
        - name: includeTorrentDb
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: "Tracks export aggregate (or `{ ok: false }` when openstats is false)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  updatedAt:
                    type: string
                    format: date-time
                  fromCache:
                    type: boolean
                  stats:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stats/meta:
    get:
      tags: [Stats]
      summary: Last stats collection time
      description: |
        Returns updatedAt for stats.json and tracks-stats.json. Used by web UI `/stats`.
        When `openstats: false`, still returns **200** with `{ ok: false }` (soft disable; not a middleware 401).
        Missing/invalid API key (when configured) is a separate **401**.
      operationId: statsMeta
      parameters:
        - $ref: "#/components/parameters/ApiKeyQuery"
      responses:
        "200":
          description: "Collection timestamps (or `{ ok: false }` when openstats is false)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/conf:
    get:
      tags: [Sync]
      summary: Sync protocol metadata
      operationId: syncConf
      security: []
      responses:
        "200":
          description: Sync capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  fbd:
                    type: boolean
                  spidr:
                    type: boolean
                  version:
                    type: integer

  /sync/fdb:
    get:
      tags: [Sync]
      summary: Sync FileDB key listing
      operationId: syncFdb
      security: []
      description: |
        Requires `opensync: true` in server config.
        When `opensync` is false, returns **200** with body `[]`.
      parameters:
        - name: key
          in: query
          schema:
            type: string
          description: Substring filter on FileDB master keys (first 20 matches)
      responses:
        "200":
          description: Matching FDB keys (or `[]` when opensync is false)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    maxItems: 0
                  - type: array
                    items:
                      $ref: "#/components/schemas/SyncFdbKeyItem"

  /sync/fdb/torrents:
    get:
      tags: [Sync]
      summary: Sync FileDB torrent collections
      description: |
        Returns torrent batches changed after `time`. Supports spidr mode and incremental `start`.
        Requires `opensync: true`. When `opensync` is false or `time` is `0`, returns
        `{ nextread: false, collections: [] }` (countread/take may be omitted).
      operationId: syncFdbTorrents
      security: []
      parameters:
        - name: time
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: start
          in: query
          schema:
            type: integer
            format: int64
            default: -1
        - name: spidr
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Collections with nextread pagination flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFdbTorrentsResponse"

  /sync/torrents:
    get:
      tags: [Sync]
      summary: Legacy sync torrents stub
      description: |
        Deprecated stub. Always returns `{ error: "use GET /sync/fdb/torrents" }`.
        Prefer `/sync/fdb/torrents`.
      operationId: syncTorrentsStub
      deprecated: true
      security: []
      parameters:
        - name: time
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Redirect-style error payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: use GET /sync/fdb/torrents

  /api/v1.0/config:
    get:
      tags: [Config]
      summary: Get current configuration
      description: |
        Returns parsed config as JSON object and serialized content (secrets included).
        **LAN or valid X-Dev-Key** (same-host proxy alone is not sufficient).
      operationId: configGet
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      parameters:
        - name: format
          in: query
          description: Serialization format for content field
          schema:
            type: string
            enum: [yaml, json]
            default: yaml
      responses:
        "200":
          description: Configuration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigGetResponse"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

    post:
      tags: [Config]
      summary: Save configuration
      description: Writes to init.yaml or init.conf. Hot-reload within ~10s. **LAN or valid X-Dev-Key.**
      operationId: configSave
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigSaveRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSaveResponse"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /api/v1.0/config/schema:
    get:
      tags: [Config]
      summary: Form schema for settings UI
      description: "**LAN or valid X-Dev-Key** (same-host proxy alone is not sufficient)."
      operationId: configSchema
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      responses:
        "200":
          description: Field groups and validation metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  schema:
                    $ref: "#/components/schemas/ConfigFormSchema"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /api/v1.0/config/validate:
    post:
      tags: [Config]
      summary: Validate configuration without saving
      description: "**LAN or valid X-Dev-Key.**"
      operationId: configValidate
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigSaveRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationResponse"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /api/v1.0/config/diff:
    post:
      tags: [Config]
      summary: Diff proposed config vs current
      description: Used by settings UI before save confirmation. **LAN or valid X-Dev-Key.**
      operationId: configDiff
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigSaveRequest"
      responses:
        "200":
          description: Diff entries and validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDiffResponse"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /api/v1.0/config/render:
    post:
      tags: [Config]
      summary: Serialize form data to YAML/JSON
      description: Form ↔ raw editor sync (settings UI). **LAN or valid X-Dev-Key.**
      operationId: configRender
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: true
                format:
                  type: string
                  enum: [yaml, json]
                  default: yaml
      responses:
        "200":
          description: Formatted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigRenderResponse"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /api/v1.0/config/parse:
    post:
      tags: [Config]
      summary: Parse YAML/JSON text to JSON object
      description: "**LAN or valid X-Dev-Key.**"
      operationId: configParse
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                format:
                  type: string
                  enum: [yaml, json]
      responses:
        "200":
          description: Parsed configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /api/v1.0/config/format:
    post:
      tags: [Config]
      summary: Pretty-print config after AppInit normalization
      description: Validates, normalizes through AppInit model, returns formatted YAML/JSON. **LAN or valid X-Dev-Key.**
      operationId: configFormat
      security:
        - DevKeyHeader: []
        - DevKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigSaveRequest"
      responses:
        "200":
          description: Normalized data and formatted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFormatResponse"
        "401":
          $ref: "#/components/responses/ConfigUnauthorized"
        "403":
          $ref: "#/components/responses/ConfigForbidden"

  /openapi.yaml:
    get:
      tags: [System]
      summary: OpenAPI specification (YAML)
      operationId: openApiYaml
      security: []
      responses:
        "200":
          description: This document
          content:
            application/yaml:
              schema:
                type: string

  /opensearch.xml:
    get:
      tags: [System]
      summary: OpenSearch description document
      description: Browser/search-plugin discovery for JacRed HTML search (`/?s={searchTerms}`).
      operationId: openSearchXml
      security: []
      responses:
        "200":
          description: OpenSearchDescription XML
          content:
            application/opensearchdescription+xml:
              schema:
                type: string

  /:
    get:
      tags: [Web]
      summary: Search PWA
      operationId: webSearch
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string

  /stats:
    get:
      tags: [Web]
      summary: Statistics PWA
      operationId: webStats
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string

  /settings:
    get:
      tags: [Web]
      summary: Settings PWA
      operationId: webSettings
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: API key (when configured in init.yaml)
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key as Bearer token
    DevKeyHeader:
      type: apiKey
      in: header
      name: X-Dev-Key
      description: Admin/dev key — required from internet or tunnel when `devkey` is set; LAN clients may omit it.
    DevKeyQuery:
      type: apiKey
      in: query
      name: devkey
      description: Same as X-Dev-Key (`?devkey=`).

  parameters:
    ApiKeyQuery:
      name: apikey
      in: query
      required: false
      schema:
        type: string
      description: API key (alternative — X-Api-Key header or Bearer)
    TorznabT:
      name: t
      in: query
      schema:
        type: string
        enum: [caps, indexers, search, tvsearch, movie, tv, moviesearch]
      description: Torznab function (`caps`, `indexers`, or search type)
    TorznabQ:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search query
    TorznabCat:
      name: cat
      in: query
      schema:
        type: string
      description: Comma-separated Torznab category ids
    TorznabImdbId:
      name: imdbid
      in: query
      schema:
        type: string
      description: IMDb id (`tt…` or bare digits); aliases `imdb_id`, `imdbId` also accepted
    TorznabTvdbId:
      name: tvdbid
      in: query
      schema:
        type: string
      description: TheTVDB id (tv-search)
    TorznabRid:
      name: rid
      in: query
      schema:
        type: string
      description: Alias for `tvdbid`
    TorznabSeason:
      name: season
      in: query
      schema:
        type: integer
      description: Season number (tv-search filter)
    TorznabEp:
      name: ep
      in: query
      schema:
        type: integer
      description: Episode number (tv-search filter)
    TorznabEpisode:
      name: episode
      in: query
      schema:
        type: integer
      description: Alias for `ep`
    TorznabTitle:
      name: title
      in: query
      schema:
        type: string
      description: Localized title (JacRed / Lampa card search)
    TorznabTitleOriginal:
      name: title_original
      in: query
      schema:
        type: string
      description: Original title (JacRed / Lampa card search)
    TorznabLimit:
      name: limit
      in: query
      schema:
        type: integer
      description: Max results after filters
    TorznabOffset:
      name: offset
      in: query
      schema:
        type: integer
      description: Result offset for pagination
    TorznabConfigured:
      name: configured
      in: query
      schema:
        type: string
      description: |
        Used with `t=indexers`. Omit, empty, or `true` returns the JacRed indexer list XML;
        `false` returns an empty `<indexers>` document.
      example: "true"
    SearchQ:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search alias for `query` / Torznab `q`
    SearchQueryAlt:
      name: Query
      in: query
      schema:
        type: string
      description: Alternate capitalization of free-text search query
    ImdbIdAltUnderscore:
      name: imdb_id
      in: query
      schema:
        type: string
      description: Alias for `imdbid`
    ImdbIdAltCamel:
      name: imdbId
      in: query
      schema:
        type: string
      description: Alias for `imdbid`
    Categories:
      name: categories
      in: query
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: |
        Torznab/Jackett category ids (repeat or comma-separated).
        Also accepted as `cat`, `Category`, `Category[]`, `Category[n]`.
    Category:
      name: Category
      in: query
      schema:
        type: string
      description: Single or comma-separated category ids (alias for `categories` / `cat`)
    CategoryBracket:
      name: Category[]
      in: query
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: Jackett/Lampa category array (e.g. 2000 movies, 5000 TV, 5070 anime)
    TrackerArray:
      name: Tracker[]
      in: query
      schema:
        type: array
        items:
          $ref: "#/components/schemas/TrackerSlug"
      style: form
      explode: true
      description: |
        Jackett-style filter by internal tracker id (e.g. kinozal, rutracker).
        Case-insensitive; matches any comma-separated part of stored trackerName.
    TrackerFilter:
      name: Tracker
      in: query
      schema:
        type: string
        description: Comma-separated `TrackerSlug` values (e.g. `kinozal,korsars`)
      description: |
        Optional tracker filter (comma-separated `TrackerSlug` values); same semantics as `Tracker[]`.
        Also accepted as `tracker` / `Tracker[n]`.
    TrackerAlias:
      name: tracker
      in: query
      schema:
        type: string
        description: Comma-separated `TrackerSlug` values (e.g. `kinozal,rutracker`)
      description: |
        Single-tracker or comma-separated alias for `Tracker[]` / `Tracker`
        (`TrackerSlug` values; case-insensitive; matches any comma-separated part of stored trackerName).
    Genres:
      name: genres
      in: query
      schema:
        type: string
      description: |
        When non-empty, enables JacRed card-metadata search mode (same trigger as title/title_original).
        Not used as a genre filter on results.
    Year:
      name: year
      in: query
      schema:
        type: integer
      description: Release year filter / card-search override
    IsSerial:
      name: is_serial
      in: query
      schema:
        type: integer
      description: "-1 unknown, 1 movie, 2 serial, 3 tvshow, 4 doc, 5 anime"

  responses:
    Unauthorized:
      description: Missing or invalid API key (when apikey is configured)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConfigUnauthorized:
      description: Invalid or missing devkey
    ConfigForbidden:
      description: Forbidden (LAN trusted client or valid X-Dev-Key / ?devkey= required)

  schemas:
    TrackerSlug:
      type: string
      description: Internal tracker id (FileDB / cron / synctrackers)
      enum:
        - anibelka
        - anidub
        - anifilm
        - aniliberty
        - animelayer
        - anistar
        - baibako
        - bitru
        - kinozal
        - knaben
        - korsars
        - leproduction
        - lostfilm
        - mazepa
        - megapeer
        - nnmclub
        - rudub
        - rutor
        - rutracker
        - selezen
        - toloka
        - torrentby
        - ultradox
        - viruseproject
      example: korsars

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: OK

    BackgroundJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/BackgroundJob"
      required: [jobs]

    BackgroundJob:
      type: object
      description: |
        JSON uses ASP.NET default naming (`PropertyNamingPolicy = null`):
        PascalCase for Key/Tracker/JobLabel/ProgressDetail and camelCase for the remaining fields.
      properties:
        Key:
          type: string
          description: Internal job key
        Tracker:
          $ref: "#/components/schemas/TrackerSlug"
        JobLabel:
          type: string
          description: Human-readable job label (e.g. ParseAll, UpdateTasks)
        startedAtUtc:
          type: string
          format: date-time
        ageSec:
          type: integer
          description: Seconds since startedAtUtc
        progressCurrent:
          type: integer
          nullable: true
        progressTotal:
          type: integer
          nullable: true
        ProgressDetail:
          type: string
          nullable: true

    VersionResponse:
      type: object
      properties:
        version:
          type: string
        gitSha:
          type: string
        gitBranch:
          type: string
        buildDate:
          type: string

    ProwlarrIndexer:
      type: object
      description: Prowlarr /api/v1/indexer list item
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
        description:
          type: string
        implementation:
          type: string
          example: Torznab
        implementationName:
          type: string
          example: Torznab
        enable:
          type: boolean
        protocol:
          type: string
          enum: [unknown, usenet, torrent]
          example: torrent

    JackettIndexer:
      type: object
      description: |
        Jackett-style indexer discovery item from `GET /api/v2.0/indexers`.
        `id=all` is the aggregate; other ids are tracker slugs from the tracker catalog.
      properties:
        id:
          type: string
          description: "'all' or a tracker id (e.g. rutracker)"
          example: all
        name:
          type: string
          example: JacRed (all trackers)
        description:
          type: string
        type:
          type: string
          example: public
        configured:
          type: boolean
        link:
          type: string
          format: uri
          example: https://github.com/jacred-fdb/jacred
      required: [id, name, configured]

    ProwlarrIndexerDetail:
      type: object
      description: Prowlarr /api/v1/indexer/{id} detail response
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
        description:
          type: string
        implementation:
          type: string
        implementationName:
          type: string
        enable:
          type: boolean
        fields:
          type: array
          items:
            type: object

    ProwlarrRelease:
      type: object
      description: Prowlarr /api/v1/search ReleaseResource item
      properties:
        guid:
          type: string
        age:
          type: integer
        ageHours:
          type: number
        ageMinutes:
          type: number
        size:
          type: integer
          format: int64
        indexerId:
          type: integer
          example: 1
        indexer:
          type: string
        title:
          type: string
        sortTitle:
          type: string
        publishDate:
          type: string
          format: date-time
        downloadUrl:
          type: string
          nullable: true
        magnetUrl:
          type: string
          nullable: true
        infoUrl:
          type: string
          nullable: true
        commentUrl:
          type: string
          nullable: true
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              subCategories:
                type: array
                items:
                  type: object
        protocol:
          type: string
          enum: [unknown, usenet, torrent]
          example: torrent
        infoHash:
          type: string
          nullable: true
        seeders:
          type: integer
        leechers:
          type: integer
        ffprobe:
          type: array
          nullable: true
          description: ffprobe streams when tracks is enabled (JacRed extension)
          items:
            type: object
            additionalProperties: true
        languages:
          type: array
          nullable: true
          description: Detected language codes (JacRed extension)
          items:
            type: string
        info:
          type: object
          nullable: true
          description: JacRed torrent metadata (voices, seasons, types, …)
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string

    ConfigSaveRequest:
      type: object
      description: Provide either `data` (JSON object) or `content` (YAML/JSON string)
      properties:
        data:
          type: object
          description: Parsed configuration object (preferred for form UI)
          additionalProperties: true
        content:
          type: string
          description: Raw init.yaml or init.conf text
        format:
          type: string
          enum: [yaml, json]
          description: Format hint for content or output file

    ConfigGetResponse:
      type: object
      properties:
        ok:
          type: boolean
        path:
          type: string
          example: init.yaml
        examplePath:
          type: string
          description: Path to example config file shipped with the app
          example: Data/example.yaml
        format:
          type: string
          enum: [yaml, json]
        displayFormat:
          type: string
        exists:
          type: boolean
        lastModifiedUtc:
          type: string
          format: date-time
        data:
          type: object
          description: Parsed config (includes secrets; LAN or devkey)
          additionalProperties: true
        content:
          type: string
          description: Serialized config text
        schema:
          $ref: "#/components/schemas/ConfigFormSchema"
        sensitiveFields:
          type: array
          items:
            type: string
        note:
          type: string

    ConfigSaveResponse:
      type: object
      properties:
        ok:
          type: boolean
        path:
          type: string
        format:
          type: string
        lastModifiedUtc:
          type: string
          format: date-time
        message:
          type: string

    ConfigValidationResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Blocking validation errors
        warnings:
          type: array
          items:
            type: string
          description: Non-blocking warnings

    ConfigDiffEntry:
      type: object
      properties:
        path:
          type: string
          example: listenport
        oldValue:
          type: string
          nullable: true
        newValue:
          type: string
          nullable: true
        sensitive:
          type: boolean
        change:
          type: string
          enum: [added, removed, changed]

    ConfigDiffResponse:
      type: object
      properties:
        ok:
          type: boolean
        diffs:
          type: array
          items:
            $ref: "#/components/schemas/ConfigDiffEntry"
        changeCount:
          type: integer
        validation:
          $ref: "#/components/schemas/ConfigValidationResponse"

    ConfigRenderResponse:
      type: object
      properties:
        ok:
          type: boolean
        content:
          type: string
        format:
          type: string
          enum: [yaml, json]

    ConfigFormatResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        content:
          type: string
          description: Pretty-printed YAML or JSON
        format:
          type: string
          enum: [yaml, json]

    ConfigFormSchema:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              description:
                type: string
              fields:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigFieldSchema"
              trackers:
                type: array
                items:
                  type: object

    ConfigFieldSchema:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
          enum: [string, int, bool, password, stringList, select, json]
        label:
          type: string
        description:
          type: string
        sensitive:
          type: boolean
        min:
          type: integer
        max:
          type: integer
        enumValues:
          type: array
          items:
            type: string

    JackettRootObject:
      type: object
      properties:
        Results:
          type: array
          items:
            $ref: "#/components/schemas/JackettResult"
        jacred:
          type: boolean
          description: Always true for JacRed responses (read-only marker)
          example: true

    JackettResult:
      type: object
      properties:
        Tracker:
          type: string
        Title:
          type: string
        Size:
          type: number
          description: Size in bytes (may be fractional from parsers)
        Seeders:
          type: integer
        Peers:
          type: integer
        MagnetUri:
          type: string
        Details:
          type: string
          format: uri
        PublishDate:
          type: string
        Category:
          type: array
          items:
            type: integer
          description: Torznab category ids
        CategoryDesc:
          type: string
        ffprobe:
          type: array
          nullable: true
          description: ffprobe streams when tracks is enabled
          items:
            type: object
            additionalProperties: true
        languages:
          type: array
          items:
            type: string
        info:
          type: object
          properties:
            quality:
              type: integer
            videotype:
              type: string
            voices:
              type: array
              items:
                type: string
            seasons:
              type: array
              items:
                type: integer
            types:
              type: array
              items:
                type: string
            sizeName:
              type: string
            name:
              type: string
            originalname:
              type: string
            relased:
              type: integer

    TorrentQuality:
      type: object
      properties:
        qualitys:
          type: array
          items:
            type: integer
        types:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        createTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time

    TorrentListItem:
      type: object
      properties:
        tracker:
          type: string
          description: |
            Tracker id, or a merged comma-separated trackerName (e.g. `kinozal,rutracker`).
            Known single slugs are listed under `TrackerSlug`.
        title:
          type: string
        size:
          type: integer
          format: int64
        sizeName:
          type: string
        url:
          type: string
          nullable: true
        createTime:
          type: string
        updateTime:
          type: string
        sid:
          type: integer
        pir:
          type: integer
        magnet:
          type: string
        name:
          type: string
        originalname:
          type: string
        relased:
          type: integer
        types:
          type: array
          items:
            type: string
        videotype:
          type: string
        quality:
          type: integer
        voices:
          type: array
          items:
            type: string
        seasons:
          type: array
          items:
            type: integer

    TrackerTracks:
      type: object
      properties:
        wait:
          type: integer
        confirm:
          type: integer
        skip:
          type: integer

    TrackerStat:
      type: object
      required: [trackerName]
      properties:
        trackerName:
          type: string
          description: |
            Tracker id or merged trackerName from stats.json.
            Known single slugs are listed under `TrackerSlug`.
        lastnewtor:
          type: string
          nullable: true
        newtor:
          type: integer
          nullable: true
        update:
          type: integer
          nullable: true
        check:
          type: integer
          nullable: true
        alltorrents:
          type: integer
          nullable: true
        tracks:
          allOf:
            - $ref: "#/components/schemas/TrackerTracks"
          nullable: true

    StatsMeta:
      type: object
      properties:
        ok:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedAtLocal:
          type: string
          nullable: true
        tracksStatsUpdatedAt:
          type: string
          format: date-time
          nullable: true

    SyncFdbKeyItem:
      type: object
      description: One FileDB master key match from `GET /sync/fdb`
      properties:
        Key:
          type: string
          description: FileDB bucket key
        updateTime:
          type: string
          format: date-time
        fileTime:
          type: integer
          format: int64
        path:
          type: string
          description: Relative path under Data/fdb
        value:
          type: object
          additionalProperties: true
          description: Opened FileDB payload for the key

    SyncFdbTorrentsResponse:
      type: object
      description: |
        Incremental torrent sync batch from `GET /sync/fdb/torrents`.
        Soft-empty when `opensync` is false or `time` is `0`: `{ nextread: false, collections: [] }`.
      properties:
        nextread:
          type: boolean
          description: True when more batches remain after this response
        countread:
          type: integer
          description: Number of torrents included in this batch
        take:
          type: integer
          description: Soft batch size threshold (default 2000)
          example: 2000
        collections:
          type: array
          items:
            $ref: "#/components/schemas/SyncFdbCollection"
      required: [nextread, collections]

    SyncFdbCollection:
      type: object
      properties:
        Key:
          type: string
          description: FileDB bucket key
        Value:
          $ref: "#/components/schemas/SyncFdbCollectionValue"
      required: [Key, Value]

    SyncFdbCollectionValue:
      type: object
      properties:
        time:
          type: string
          format: date-time
        fileTime:
          type: integer
          format: int64
        torrents:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: Map of torrent id → torrent details (full or spidr-slim)

security:
  - ApiKeyQuery: []
  - ApiKeyHeader: []
  - Bearer: []
