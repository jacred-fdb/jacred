# JacRed HTTP job schedule (replaces Data/crontab)
# schedule: standard 5-field cron (minute hour day month dow)
# path: relative to base_url
# enabled: false  # optional — skip this job

base_url: http://127.0.0.1:9117

jobs:
  # JSON DB
  - name: jsondb-save
    schedule: "*/5 * * * *"
    path: /jsondb/save

  # Rutor
  - name: rutor-parse
    schedule: "*/15 * * * *"
    path: /cron/rutor/parse
  # Once every 4h (NOT "* */4" — that fires every minute in those hours)
  - name: rutor-UpdateTasksParse
    schedule: "5 */4 * * *"
    path: /cron/rutor/UpdateTasksParse
  - name: rutor-ParseAllTask
    schedule: "30 * * * *"
    path: /cron/rutor/ParseAllTask

  # Rutracker
  - name: rutracker-parse
    schedule: "0 * * * *"
    path: /cron/rutracker/parse
  - name: rutracker-UpdateTasksParse
    schedule: "20 * * * *"
    path: /cron/rutracker/UpdateTasksParse
  - name: rutracker-ParseAllTask
    schedule: "40 * * * *"
    path: /cron/rutracker/ParseAllTask

  # Kinozal
  - name: kinozal-parse
    schedule: "*/15 * * * *"
    path: /cron/kinozal/parse
  - name: kinozal-UpdateTasksParse
