  "search": {
    "mergeV1": "auto", // false | auto (v1 fuzzy только fuzzy) | true
    "maxV1Pairs": 4, // Лимит v1-пар при mergeV1=auto
    "v1Sort": "sid", // sid (seeders), pir, size
    "stripTrailingYear": true, // Fuzzy: запрос без года
    "skipCatFilter": true // cat/Category[] не режутся на сервере
  },
  "torznab": {
    "enable": true, // Torznab XML; Lampa Jackett JSON работает всегда
    "enrichTitles": true // Озвучки в Torznab XML title
