    "ultradox",
    "viruseproject"
  ],
  "disable_trackers": [],
  "syncsport": true,
  "syncspidr": true,
  "maxreadfile": 250,
  "fdbPathLevels": 2, //Уровни вложенности каталогов fdb
  "tracks": false, //Вкл|выкл модуля tracks
  "trackslog": true, //Включение логов Data/log/tracks.log
  "trackscategory": "jacred", //Категория для торрентов из jacred. Рекомендуется задавать уникально для каждого инстанса.
  "tracksdelay": 20000, //Задержка между запросами к tsuri, мс
  "tracksatempt": 20, //Количество неудачных попыток извлечь дорожки, после этого торрент исключается из tracks
  "tracksconcurrency": 2, //Глобальный лимит параллельных анализов к tsuri
  "tracksffptimeout": 60, //Таймаут HTTP /ffp при sid > 0, сек
  "tracksffptimeoutnosid": 30, //Таймаут HTTP /ffp при sid == 0, сек
  "tracksreadtimeout": 30, //Ожидание file_stats от TorrServer, сек
  "trackspeerwaittimeout": 30, //Проверка сидов/bytes_read перед /ffp, сек
  "tracksffpretry": 2, //Доп. file id для /ffp за одну попытку
  "tracksminbufferkb": 512, //Мин. буфер перед /ffp, KB
  "tracksorphansweepmin": 15, //Интервал rem сирот в trackscategory, мин
  "tracksmod": 0, //Режим: 0 - все торренты. 1 - только за текущие сутки
  "tracksinterval": {
    "task1": 60, //Интервал запуска задачи tracks за последние сутки, мин
    "task0": 180 //Интервал запуска всех остальных задач, мин
  },
  "tsuri": [
    "http://127.0.0.1:8090"
  ],
  "timeStatsUpdate": 15,
  "timeSync": 120,
  "timeSyncSpidr": 360,
  "saveCheckpointEveryNBatches": 5,
