{
  "listenip": "any",
  "listenport": 9117,
  "apikey": "", //Ключ авторизации API (пусто — без проверки)
  "devkey": "", //Ключ для доступа к /dev/, /cron/, /jsondb за туннелем/прокси (пусто — только локальная сеть)
  "flaresolverr": {
    "enable": true,
    "url": "http://127.0.0.1:8191/v1", // в docker-compose: http://flaresolverr:8191/v1
    "maxTimeoutMs": 300000,
    "sessionIdleMinutes": 120,
    "browserTimeoutRetries": 1,
    "recycleAfterTimeouts": 3,
    "guardedHours": 6,
    "recheckMinutes": 30 // VPS: PROXY_* на контейнере FlareSolverr (не здесь)
  },
  "mergeduplicates": true,
  "mergenumduplicates": true, //Объединять дубликаты по номеру (серии и т.п.)
  "openstats": true,
  "opensync": true,
  "web": true, //Раздавать статику (веб-интерфейс)
  "logFdb": true,
  "logFdbRetentionDays": 7,
  "logFdbMaxSizeMb": 0,
  "logFdbMaxFiles": 0,
  "logParsers": true,
  "syncapi": "https://sync.jacred.stream",
  "synctrackers": [
    "anibelka",
    "anidub",
    "anifilm",
    "aniliberty",
    "animelayer",
    "anistar",
    "baibako",
    "bitru",
    "kinozal",
    "knaben",
